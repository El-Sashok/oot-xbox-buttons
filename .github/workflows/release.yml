name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            binary: oot-xbox-buttons-linux
          - os: windows-latest
            binary: oot-xbox-buttons-windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --onefile --name ${{ matrix.binary }} --collect-submodules fontTools.ttLib.tables build_mod.py
      - run: ./dist/${{ matrix.binary }} --help
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: binaries
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" binaries/* --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
        env:
          GH_TOKEN: ${{ github.token }}
